<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaliHold</title>
  <meta name="description" content="CaliHold — structured calisthenics for beginners.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 24px;
    }
    h1 {
      font-family: 'Anton', Impact, sans-serif;
      color: #FED12E;
      font-size: clamp(64px, 16vw, 160px);
      letter-spacing: 2px;
      line-height: 1;
    }
    .tagline {
      font-family: 'Anton', Impact, sans-serif;
      font-size: clamp(20px, 4.5vw, 34px);
      margin-top: 16px;
      letter-spacing: 1px;
    }
    .note {
      margin-top: 20px;
      font-size: 17px;
      color: #cfcfcf;
      max-width: 460px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      margin-top: 36px;
      background: #FED12E;
      color: #000;
      font-family: 'Anton', Impact, sans-serif;
      font-size: 22px;
      letter-spacing: 1px;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 6px;
    }
    .btn:hover { opacity: 0.9; }
    footer {
      position: fixed;
      bottom: 20px;
      font-size: 14px;
      color: #8a8a8a;
    }
    footer a { color: #8a8a8a; }
  </style>
</head>
<body>
  <h1><span style="color:#fff;">Cali</span>Hold</h1>
  <p class="tagline">STRUCTURED CALISTHENICS FOR BEGINNERS</p>
  <p class="note">A free beginner roadmap guide is coming soon. Start with the videos on YouTube.</p>
  <a class="btn" href="https://www.youtube.com/@CaliHold" target="_blank" rel="noopener">WATCH ON YOUTUBE</a>
  <footer>Contact: <a href="mailto:Hello@CaliHold.com">Hello@CaliHold.com</a></footer>
</body>
</html>
